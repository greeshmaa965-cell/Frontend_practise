<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Order</title>
    <style>
        #container{
            height:300px;
            width:400px;
            padding:10px;
            margin:20px;
            border:3px solid black;
            display:flex;
            flex-direction: row;
            justify-content:center;
            flex-wrap:wrap;
            align-items:start;
        }
        .box{
            height:50px;
            width:50px;
            border:3px solid black;
            margin-right:5px;
        }
        #box1{
            background-color: aliceblue;
        }
        #box2{
            background-color: lightcoral;
        }
        #box3{
            background-color: lightcyan;
            order: -1;
        }</style>
</head>
<body>
    <div id="container">
        <div class="box" id="box1">Flexbox 1</div>
        <div class="box" id="box2">Flexbox 2</div>
        <div class="box" id="box3">Flexbox 3</div>
    </div>
</body>
</html>
