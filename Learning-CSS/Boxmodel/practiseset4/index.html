<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practise set 4</title>
    <style>
       * {
            margin: 0;
            padding: 0;
        }
        #first
        {
            height:200px;
            width:200px;
            background-color: lightblue;
        }
        #Button1
        {
            height:70px;
            width:70px;
            padding:10px 15px 10px 15px;
             background-color: lightcoral;
             margin :100px;
             border:2px dotted red;
             border-radius:50px;
        }
        #First
        {
            height:50px;
            width:50px;
            background-color: lightblue;
           box-sizing: content-box;
        }
        #Second
        {
            height:50px;
            width:50px;
            background-color: lightcoral;
            box-sizing: border-box;
        }
        
        </style>
</head>
<body>
    <div id="first" class="pad">First</div>
    <Button id="Button1">Click me</Button>
    <div id="First">Box1</div>
    <div id="Second">Box2</div>

</body>
</html>
