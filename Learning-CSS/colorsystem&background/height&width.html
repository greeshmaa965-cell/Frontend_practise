<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and width</title>
    <style>
        .box {
            width: 200px;
            height: 100px;
        }
        #box1 {
            background-color: lightcoral;
        }   
        #box2 {
            background-color: lightseagreen;
        }
        #box3 {
            background-color: lightblue;
        }
        </style>
</head>
<body>
    <div id="box1" class="box">This is 1st box</div><br>
    <div id="box2" class="box">This is 2nd box</div><br>
    <div id="box3" class="box">This is 3rd box</div>
</body>
</html>
