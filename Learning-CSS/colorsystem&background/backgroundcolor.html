<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackGround color</title>
    <style>
        #first{color:red; background-color:black;}
        #second{color:blue; background-color:black;}
        button{color:green; background-color:black;}
    *{margin:0; padding:0;}
    </style>
</head>
<body>
    <div id="first">
        This is a div with red text on a black background.
    </div>
    <div id="second">
        This is a div with blue text on a black background.
    </div>
    <button>Click me</button>
</body>
</html>
