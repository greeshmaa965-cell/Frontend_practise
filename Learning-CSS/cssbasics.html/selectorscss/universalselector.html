<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal selector</title>
    <style>
        * {
            color: purple;
        }
        </style>
</head>
<body>
    <h1>This is universal selector heading</h1>
    <p>This paragraph is styled using the universal selector.</p>
</body>
</html>
