<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descendant Selector</title>
    <style>
        #first p {
            color: darkseagreen;
        }</style>
</head>
<body>
    <div id="first">
        <h1>This is a heading inside a div with ID 'first'</h1>
        <p>This paragraph is inside the div with ID 'first' and is styled using a descendant selector.</p></div>
        <p>This paragraph is outside the div with ID 'first' and is not affected by the descendant selector.</p>
</body>
</html>
