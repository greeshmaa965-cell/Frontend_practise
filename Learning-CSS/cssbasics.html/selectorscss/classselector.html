<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class selctor</title>
    <style>
        #first{color:yellow;}
        .random{color:lightblue;}</style>
</head>
<body>
    <h1 id="first">This is a heading with ID selector</h1>
    <p class="random">This paragraph is styled using a class selector.</p>
    <h1 class="random">This is a heading with class selector</h1>
</body>
</html>
