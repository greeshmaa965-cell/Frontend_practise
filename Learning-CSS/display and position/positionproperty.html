<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position property</title>
    <style>
        div
        
        {
            background-color:red;
            height:200px;
            width:200px;
           border:5px solid black;
           margin:5px;
        }
        #div1{
            position:static;
            
        }
        #div2{
            position:relative;
            top:20px;
            left:90px;
        }
        #div3{
            position:fixed;
            top:100px;
            left:150px;
        }
        #div4{
            position:absolute;
            top:200px;
            left:200px;
        }
        </style>
        
</head>
<body>
    <div id="div1">Static</div>
    <div id="div2">Relative</div>
    <div id="div3">Fixed</div>
    <div id="div4">Absolute</div>
</body>
</html>
