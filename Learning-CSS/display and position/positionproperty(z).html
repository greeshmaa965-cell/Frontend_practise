<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property z</title>
    <style>
        .container
        {
            position:relative;
        }
        .box1,.box2{
            position:absolute;
            border:3px solid black;
            height:100px;   
            width:100px;
            text-align:center;
            font-size:25px;
        }
        .box1{
            background-color:lightblue;
            top:50px;
            left:50px;
            z-index:1;
        }
        .box2{
            background-color:lightcoral;
            top:100px;
            left:100px;
            z-index:2;
        }</style>
</head>
<body>
    <div class="container">
        <div class="box1">Box 1</div>
        <div class="box2">Box 2</div>
</body>
</html>
