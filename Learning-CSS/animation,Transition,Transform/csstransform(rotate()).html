<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Tranform </title>
    <style>
        .box{
            width: 200px;
            text-align: center;
            font-size: 20px;
            height: 200px;
            border:5px solid black;
            background-color: rgb(209, 103, 103);
            border-radius:5px;
            position:relative;
            top: 100px;
            left: 100px;}
           .box:hover{
                transform: rotatex(360deg);
                transition-duration: 1s;
            
        }</style>
</head>
<body>
    <div class="box">Rotate me</div>
</body>
</html>
