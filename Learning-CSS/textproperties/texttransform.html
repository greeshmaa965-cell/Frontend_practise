<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transform</title>
    <style>
        #box1{
            text-transform: uppercase;
            background-color: lightblue;
        }
        #box2{
            text-transform: lowercase;
            background-color: lightgreen;
        }
        #box3{
            text-transform: capitalize;
            background-color: lightcoral;
        }
        #box4{
            text-transform: none;
        }
    </style>
</head>
<body>
    <h1 id="box1">This is UPPERCASE text</h1>
    <h1 id="box2">This is lowercase text</h1>
    <h1 id="box3">This is Capitalized text</h1>
    <h1 id="box4">This is normal text</h1>
</body>
</html>
