<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration style</title>
    <style>
        #box1{
            
            text-decoration: underline;
            background-color: lightblue;
        }
        #box2{
            text-decoration: overline;
        }
        #box3{
            text-decoration: line-through;
            background-color: lightcoral;
        }
        #box4{
            text-decoration-line: underline;
            text-decoration-style: dashed;
        }
        #box5{
            text-decoration-line: underline;
            text-decoration-style: wavy;
        }
        #box6{
            text-decoration-line: underline;
            text-decoration-style: double;
        }
        #box7{
            text-decoration-line: underline;
            text-decoration-style: dotted;
        }
    </style>
</head>
<body>
    <h1 id="box1">This is underlined text</h1>
    <h1 id="box2">This is overlined text</h1>
    <h1 id="box3">This is striked through text</h1>
    <h1 id="box4">This is dashed text</h1>
    <h1 id="box5">This is wavy text</h1>    
    <h1 id="box6">This is double underlined text</h1>
    <h1 id="box7">This is dotted text</h1>
    <hr>
    <a href="#" style="text-decoration: none;">This is a link without underline</a><br>
    <a href="#">Link wth default underline</a>
</body>
</html>
