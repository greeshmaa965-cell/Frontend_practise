<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font style</title>
    <style>
        #box1{
            font-style: normal;
            background-color: lightblue;
        }
        #box2{
            font-style: italic;
            background-color: lightgreen;
        }
        #box3{
            font-style: oblique;
            background-color: lightcoral;
        }</style>
</head>
<body>
    <h1 id="box1">This is normal font style</h1>
    <h1 id="box2">This is italic font style</h1>
    <h1 id="box3">This is oblique font style</h1>
</body>
</html>
