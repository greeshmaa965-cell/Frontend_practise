<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font size</title>
    <style>
        #box1{
            font-size: 12px;
            background-color: lightblue;
        }
        #box2{
            font-size: 16px;
            background-color: lightgreen;
        }
        #box3{
            font-size: 20px;
            background-color: lightcoral;
        }</style>
</head>
<body>
    <h1 id="box1">This is 12px font size</h1>
    <h1 id="box2">This is 16px font size</h1>
    <h1 id="box3">This is 20px font size</h1>
</body>
</html>
