<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font weight</title>
    <style>
        #box1{
            font-weight: normal;
            background-color: lightblue;
        }
        #box2{
            font-weight: bold;
            background-color: lightgreen;
        }
        #box3{
            font-weight: 900;
            background-color: lightcoral;
        }
        #box4{
            font-weight: 100;
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <h1 id="box1">This is normal font weight</h1>
    <h1 id="box2">This is bold font weight</h1>
    <h1 id="box3">This is 900 font weight</h1>
    <h1 id="box4">This is 100 font weight</h1>
</body>
</html>
