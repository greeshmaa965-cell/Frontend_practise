<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-align property</title>
    <style>
    .box
    {
        width: 300px;
        height: 100px;
    }
    #box1{
        text-align: left;
        background-color: lightblue;
    }
    #box2{
        text-align: center;
        background-color: lightgreen;
    }
    #box3{
        text-align: right;
        background-color: lightcoral;
    }
    </style>
</head>
<body>
    <h1 id="box1" class="box">This is a box</h1>
    <h1 id="box2" class="box">This is a box</h1>
    <h1 id="box3" class="box">This is a box</h1>
</body>
</html>
