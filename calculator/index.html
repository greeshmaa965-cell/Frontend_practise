<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="calculator">
    <input id="Input_container" type="text" readonly><br>
    <div id="Button_container">
        <button class="btn"  onclick="currentDisplay=''; document.querySelector('#Input_container').value=currentDisplay;" >C</button>
        <button class="btn" onclick="currentDisplay+='/', document.querySelector('#Input_container').value=currentDisplay;" >/</button>
        <button class="btn" onclick="currentDisplay+='*'; document.querySelector('#Input_container').value=currentDisplay;" >*</button>
        <button class="btn" onclick="currentDisplay+='-'; document.querySelector('#Input_container').value=currentDisplay;" >-</button>
        <button class="btn" onclick="currentDisplay+='+'; document.querySelector('#Input_container').value=currentDisplay;" >+</button>
        <button class="btn" onclick=" let result=eval(currentDisplay); currentDisplay=result; document.querySelector('#Input_container').value=currentDisplay;" >=</button>
        <button class="btn" onclick="currentDisplay+='.'; document.querySelector('#Input_container').value=currentDisplay;" >.</button>
        <button class="btn" onclick="currentDisplay+='0'; document.querySelector('#Input_container').value=currentDisplay;" >0 </button>
        <button class="btn" onclick="currentDisplay+='1'; document.querySelector('#Input_container').value=currentDisplay;" >1</button>
        <button class="btn" onclick="currentDisplay+='2'; document.querySelector('#Input_container').value=currentDisplay;" >2</button>
        <button class="btn" onclick="currentDisplay+='3'; document.querySelector('#Input_container').value=currentDisplay;" >3</button>
        <button class="btn" onclick="currentDisplay+='4'; document.querySelector('#Input_container').value=currentDisplay;" >4</button>
        <button class="btn" onclick="currentDisplay+='5'; document.querySelector('#Input_container').value=currentDisplay;" >5</button>
        <button class="btn" onclick="currentDisplay+='6'; document.querySelector('#Input_container').value=currentDisplay;" >6</button>
        <button class="btn" onclick="currentDisplay+='7'; document.querySelector('#Input_container').value=currentDisplay;" >7</button>
        <button class="btn" onclick="currentDisplay+='8'; document.querySelector('#Input_container').value=currentDisplay;" >8</button>
        <button class="btn" onclick="currentDisplay+='9'; document.querySelector('#Input_container').value=currentDisplay;" >9</button>
    </div>
    </div>
    <script>
        let currentDisplay='';
        document.querySelector('#Input_container').value=currentDisplay;

    </script>
</body>
</html>
